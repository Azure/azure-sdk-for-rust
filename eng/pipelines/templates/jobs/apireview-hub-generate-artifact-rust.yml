parameters:
  - name: kind
    type: string
    values:
      - base
      - target
  - name: requestMode
    type: string
    values:
      - create
      - update
  - name: repositoryOwner
    type: string
    default: Azure
  - name: ref
    type: string
  - name: packageName
    type: string
  - name: operationId
    type: string
  - name: poolName
    type: string
    default: 'azsdk-pool'
  - name: imageOverride
    type: string
    default: 'ubuntu-24.04'

jobs:
  - template: /eng/common/pipelines/templates/jobs/apireview-hub-generate-artifact-base.yml
    parameters:
      ${{ if eq(parameters.kind, 'base') }}:
        jobName: GenerateBase
      ${{ if eq(parameters.kind, 'target') }}:
        jobName: GenerateTarget
      kind: ${{ parameters.kind }}
      requestMode: ${{ parameters.requestMode }}
      language: rust
      repositoryFullName: ${{ format('{0}/{1}', parameters.repositoryOwner, 'azure-sdk-for-rust') }}
      ref: ${{ parameters.ref }}
      packageName: ${{ parameters.packageName }}
      operationId: ${{ parameters.operationId }}
      poolName: ${{ parameters.poolName }}
      imageOverride: ${{ parameters.imageOverride }}
      stepList:
        - template: /eng/pipelines/templates/steps/use-rust.yml
          parameters:
            SourcesDir: $(Build.SourcesDirectory)
            Toolchain: nightly

        - task: PowerShell@2
          displayName: Generate ${{ parameters.kind }} Rust API review bundle
          inputs:
            pwsh: true
            targetType: inline
            script: |
              $ErrorActionPreference = 'Stop'
              . ([System.IO.Path]::Combine($env:SOURCE_DIRECTORY, 'eng', 'common', 'scripts', 'common.ps1'))
              . ([System.IO.Path]::Combine($RepoRoot, 'eng', 'scripts', 'shared', 'common.ps1'))
              $package = Get-CargoPackageByName -WorkspacePackages (Get-CargoPackages) -PackageName $env:PACKAGE_NAME
              $arguments = @(
                '--root', $env:SOURCE_DIRECTORY,
                '--manifest-path', $package.manifest_path,
                '--output-dir', $env:ARTIFACT_OUTPUT_DIRECTORY,
                '--review'
              )

              $fileName = if ($IsWindows) { 'generate_api.exe' } else { 'generate_api' }
              $toolPath = ([System.IO.Path]::Combine($env:BIN_DIRECTORY, $fileName))
              if (!$IsWindows) {
                Invoke-LoggedCommand 'chmod +x "$toolPath"' -GroupOutput
              }
              Start-PipedProcess -FilePath $toolPath -ArgumentList $arguments -WorkingDirectory $env:SOURCE_DIRECTORY -GroupOutput | Out-Null
            workingDirectory: $(Build.SourcesDirectory)
          env:
            SOURCE_DIRECTORY: $(Build.SourcesDirectory)
            BIN_DIRECTORY: $(BinDirectory)
            ARTIFACT_OUTPUT_DIRECTORY: $(ArtifactOutputDirectory)
            PACKAGE_NAME: ${{ parameters.packageName }}
