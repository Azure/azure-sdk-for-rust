parameters:
# required matrix parameters
- name: UsePlatformContainer
  type: boolean
- name: OSName
  type: string
- name: Matrix
  type: object
- name: DependsOn
  type: string
- name: CloudConfig
  type: object
# custom parameters
- name: ServiceDirectory
  type: string
- name: TimeoutInMinutes
  type: number
- name: TestProxy
  type: boolean
- name: InstallMsRust
  type: boolean
  default: false


jobs:
- job:
  displayName: "Test"
  condition: and(succeeded(), ne(variables['Skip.Tests'],'true'), ne(${{ parameters.Matrix }}, '{}'))
  timeoutInMinutes: ${{ parameters.TimeoutInMinutes }}
  dependsOn: ${{ parameters.DependsOn }}
  # Allow matrix entries to opt into non-blocking behavior by setting
  # `ContinueOnError: "true"` as a matrix variable. Defaults to false so
  # existing matrix entries / consumers see no behavior change.
  continueOnError: $[ coalesce(variables['ContinueOnError'], 'false') ]

  strategy:
    matrix: $[ ${{ parameters.Matrix }} ]

  pool:
    name: $(Pool)
    # 1es pipeline templates converts `image` to demands: ImageOverride under the hood
    # which is incompatible with image selection in the default non-1es hosted pools
    ${{ if eq(parameters.OSName, 'macOS') }}:
      vmImage: $(OSVmImage)
    ${{ else }}:
      image: $(OSVmImage)
    os: ${{ parameters.OSName }}

  steps:
  - template: /eng/common/pipelines/templates/steps/sparse-checkout.yml
    parameters:
      paths:
      - "/*"

  - ${{ if eq(parameters.InstallMsRust, true) }}:
    - pwsh: |
        Move-Item $(Build.SourcesDirectory)/eng/templates/rust-toolchain.toml.template $(Build.SourcesDirectory)/rust-toolchain.toml
      displayName: 'Configure MS Rust rust-toolchain.toml'

    - task: RustInstaller@1
      inputs:
        toolchainFeed: https://pkgs.dev.azure.com/azure-sdk/internal/_packaging/ms-rust-tools/nuget/v3/index.json
      displayName: Install MS Rust toolchain

    # TODO: Refactor this into a template used in use-rust.yml
    - pwsh: |
        $cargoHome = $env:CARGO_HOME
        if (-not $cargoHome) { $cargoHome = ([System.IO.Path]::Combine($HOME, '.cargo')) }
        New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null

        $configPath = ([System.IO.Path]::Combine($cargoHome, 'config.toml'))
        Copy-Item `
          -Path '$(Build.SourcesDirectory)/eng/templates/config.toml.template' `
          -Destination $configPath `
          -Force

        Write-Host "Wrote cargo config to $configPath"
        Get-Content $configPath
        Write-Host "##vso[task.setvariable variable=CargoConfigPath]$configPath"
      displayName: Configure cargo to use the azure-sdk-for-rust feed

    - task: CargoAuthenticate@0
      displayName: Authenticate cargo to the azure-sdk-for-rust feed
      inputs:
        configFile: $(CargoConfigPath)

  - ${{ else }}:
    - template: /eng/pipelines/templates/steps/use-rust.yml@self
      parameters:
        Toolchain: $(RustToolchainName)

  - template: /eng/pipelines/templates/steps/nuget-config.yml

  - template: /eng/pipelines/templates/steps/vcpkg.yml

  - template: /eng/common/pipelines/templates/steps/set-default-branch.yml@self

  - template: /eng/common/pipelines/templates/steps/save-package-properties.yml@self
    parameters:
      ServiceDirectory: ${{ parameters.ServiceDirectory }}
      PackageInfoDirectory: $(Build.ArtifactStagingDirectory)/PackageInfo

  - pwsh: |
      Write-Host "##vso[task.setvariable variable=Logging__LogLevel__Default]Debug"
    displayName: 'Enable Verbose Logging'
    condition: eq(variables['System.Debug'], 'true')

  - ${{ if eq(parameters.TestProxy, true) }}:
    - template: /eng/common/testproxy/test-proxy-standalone-tool.yml

  - task: Powershell@2
    displayName: "Test Packages"
    condition: and(succeeded(), ne(variables['NoPackagesChanged'],'true'))
    timeoutInMinutes: ${{ parameters.TimeoutInMinutes }}
    env:
      CIBW_BUILD_VERBOSITY: 3
    inputs:
      pwsh: true
      filePath: $(Build.SourcesDirectory)/eng/scripts/Test-Packages.ps1
      arguments: >
        -PackageInfoDirectory '$(Build.ArtifactStagingDirectory)/PackageInfo'

  - task: Powershell@2
    displayName: Convert Test Results to JUnit XML
    condition: and(succeededOrFailed(), ne(variables['NoPackagesChanged'],'true'))
    inputs:
      pwsh: true
      filePath: $(Build.SourcesDirectory)/eng/scripts/Convert-TestResultsToJUnit.ps1

  - task: PublishTestResults@2
    displayName: Publish Test Results
    condition: and(succeededOrFailed(), ne(variables['NoPackagesChanged'],'true'), eq(variables['HasJUnitTestResults'], 'true'))
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: '**/test-results/junit/*.xml'
      testRunTitle: Rust Tests - $(Agent.JobName)
      mergeTestResults: true
      failTaskOnFailedTests: false

  - ${{ if eq(parameters.TestProxy, true) }}:
    - pwsh: |
        # $(Build.SourcesDirectory)/test-proxy.log is the hardcoded output log location for the test-proxy-tool.yml
        cat $(Build.SourcesDirectory)/test-proxy.log
      displayName: 'Dump Test Proxy logs'
      condition: and(succeededOrFailed(), eq(variables['System.Debug'], 'true'))

    - pwsh: |
        try {
          $response = Invoke-WebRequest -Uri 'http://localhost:5000/Audit/Logs' -UseBasicParsing -ErrorAction Stop
          Write-Host $response.Content
        } catch {
          Write-Host "Failed to retrieve Test Proxy Audit Logs from http://localhost:5000/Audit/Logs"
          Write-Host $_
        }
      displayName: 'Dump Test Proxy Audit Logs'
      condition: and(succeededOrFailed(), eq(variables['System.Debug'], 'true'))
