parameters:
- name: ServiceDirectory
  type: string
- name: Toolchain
  type: string
- name: TimeoutInMinutes
  type: number

jobs:
- job: "Analyze"
  condition: and(succeededOrFailed(), ne(variables['Skip.Analyze'], 'true'))
  timeoutInMinutes: ${{ parameters.TimeoutInMinutes }}

  pool:
    os: linux
    name: $(LINUXPOOL)
    image: $(LINUXVMIMAGE)

  steps:
  - template: /eng/common/pipelines/templates/steps/sparse-checkout.yml
    parameters:
      paths:
      - "/*"

  # Install nightly so doc-rs runs correctly in Analyze-Code.ps1
  - template: /eng/pipelines/templates/steps/use-rust.yml@self
    parameters:
      Toolchain: nightly

  # Install the specified version of Rust if invocation is not using 'nightly'
  - ${{ if ne(parameters.Toolchain, 'nightly') }}:
      - template: /eng/pipelines/templates/steps/use-rust.yml@self
        parameters:
          Toolchain: ${{ parameters.Toolchain }}
          # Since the registry is configured in the previous run, it does not
          # need to be configured in this run
          ConfigureRegistry: false

  - template: /eng/common/pipelines/templates/steps/save-package-properties.yml
    parameters:
      ServiceDirectory: ${{ parameters.ServiceDirectory }}

  - ${{ if eq(parameters.ServiceDirectory, 'cosmos') }}:
    - template: /eng/common/pipelines/templates/steps/run-pester-tests.yml
      parameters:
        TargetDirectory: sdk/cosmos/eng/scripts/tests
        CustomTestSteps:
        - pwsh: |
            $config = New-PesterConfiguration
            $config.Run.Path = './CosmosVNext.Tests.ps1'
            $config.Run.PassThru = $true
            $config.TestResult.Enabled = $true
            $config.TestResult.OutputPath = 'testResults.xml'
            $result = Invoke-Pester -Configuration $config
            if ($result.FailedCount -gt 0 -or $result.TotalCount -eq 0) {
              throw 'Cosmos vNext lifecycle tests failed or no tests were discovered.'
            }
          displayName: Test Cosmos vNext lifecycle
          workingDirectory: $(Build.SourcesDirectory)/sdk/cosmos/eng/scripts/tests

  # Always skip audit. Audit requires contact with restricted endpoints and is
  # excluded from use in internal builds. Instead, teams must check on the state
  # of the Audit in GitHub Actions.
  - task: Powershell@2
    displayName: "Run source analysis"
    inputs:
      pwsh: true
      filePath: $(Build.SourcesDirectory)/eng/scripts/Analyze-Code.ps1
      arguments: >
        -PackageInfoDirectory '$(Build.ArtifactStagingDirectory)/PackageInfo'
        -Toolchain 'nightly'
        -SkipPackageAnalysis:('$(NoPackagesChanged)' -eq 'true')
        -Audit:$false
        -Deny

  - task: UseNode@1
    displayName: 'Use Node.js 22.x'
    inputs:
      version: 22.x

  - template: /eng/common/pipelines/templates/steps/check-spelling.yml
    parameters:
      ContinueOnError: false
