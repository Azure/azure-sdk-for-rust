parameters:
  - name: Toolchain
    type: string
    default: active
    # Expected values: 'stable', 'nightly', 'msrv', 'active' or a specific toolchain version
    # 'msrv' will read the MSRV from azure_core
    # 'active' will use the active toolchain for the working directory, which will be from rust-toolchain.toml, from a
    #   folder override or the rustup default toolchain
  - name: MaxAttempts
    type: number
    default: 3
  - name: WorkingDirectory
    type: string
    default: $(System.DefaultWorkingDirectory)
  - name: SetDefault
    type: boolean
    default: true
  - name: ConfigureRegistry
    type: boolean
    default: true

steps:
# `variables/rust.yml` may relocate CARGO_HOME off the OS volume. Cargo finds its own
# subcommands there, but tools invoked directly (taplo, cargo2junit) need it on PATH.
- pwsh: |
    $cargoBin = ([System.IO.Path]::Combine($env:CARGO_HOME, 'bin'))
    New-Item -ItemType Directory -Force -Path $cargoBin | Out-Null

    if (($env:PATH -split [System.IO.Path]::PathSeparator) -notcontains $cargoBin) {
      Write-Host "##vso[task.prependpath]$cargoBin"
    }
  displayName: Add CARGO_HOME/bin to PATH
  condition: and(succeeded(), ne(variables['CARGO_HOME'], ''))

- ${{ if parameters.ConfigureRegistry }}:
  # CI builds run under network isolation with no access to public crates.io. Route
  # crates.io traffic through the azure-sdk-for-rust Azure Artifacts feed defined in
  # eng/templates/config.toml.template, then authenticate cargo to it.
  - pwsh: |
      $cargoHome = $env:CARGO_HOME
      if (-not $cargoHome) { $cargoHome = ([System.IO.Path]::Combine($HOME, '.cargo')) }
      New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null

      $configPath = ([System.IO.Path]::Combine($cargoHome, 'config.toml'))
      Copy-Item `
        -Path '$(Build.SourcesDirectory)/eng/templates/config.toml.template' `
        -Destination $configPath `
        -Force

      Write-Host "Wrote cargo config to $configPath"
      Get-Content $configPath
      Write-Host "##vso[task.setvariable variable=CargoConfigPath]$configPath"
    displayName: Configure cargo to use the azure-sdk-for-rust feed

  # Workaround issue in public pipelines. Revert when root cause issue is fixed:
  # https://github.com/microsoft/azure-pipelines-tasks/issues/22421
  # NuGetAuthenticate@1 uses the SYSTEMVSSCONNECTION endpoint token, which Azure
  # DevOps does deliver to fork builds, and publishes it as VSS_NUGET_ACCESSTOKEN
  # for later steps.
  - task: NuGetAuthenticate@1
    displayName: Acquire an Azure Artifacts token that fork builds can use

  - task: CargoAuthenticate@0
    displayName: Authenticate cargo to the azure-sdk-for-rust feed
    inputs:
      configFile: $(CargoConfigPath)
    env:
      SYSTEM_ACCESSTOKEN: $(VSS_NUGET_ACCESSTOKEN)

- pwsh: |
    $Toolchain = '${{ parameters.Toolchain }}'
    $MaxAttempts = ${{ parameters.MaxAttempts }}  
    $SetDefault = $${{ parameters.SetDefault }}

    function Invoke-LoggedCommand($command) {
        Write-Host "##[group]$command"
        Invoke-Expression $command
        Write-Host "##[endgroup]"
        if ($LASTEXITCODE -ne 0) {
            Write-Host "Command failed: $command"
            exit $LASTEXITCODE
        }
    }

    if ($Toolchain -eq 'msrv') {
        Write-Host "Reading MSRV from azure_core"
        $toolchainArg = cargo read-manifest --manifest-path "$(System.DefaultWorkingDirectory)/sdk/core/azure_core/Cargo.toml"
          | ConvertFrom-Json
          | Select-Object -ExpandProperty rust_version
    }
    elseif ($Toolchain -eq 'active') {
        # You can't call 'rustup install' without a toolchain before rustup 1.28.0. If know we'll be doing that, make sure
        # we have the latest rustup installed
        
        # Depending on the version of rustup currently installed, simply calling `rustup --version` will install the
        # active toolchain per rust-toolchain.toml if it's not already installed. We should check the rust version
        # outside of our repo's context to avoid any rustup-toolchain file influence.

        Push-Location '$(Pipeline.Workspace)'
        Invoke-LoggedCommand "rustup --version" | Tee-Object -Variable rustupVersion
        
        if ($rustupVersion -match 'rustup (\d+).(\d+).\d+') {
            $major = $matches[1]
            $minor = $matches[2]
            if ($major -lt 1 -or $minor -lt 28) {
                Invoke-LoggedCommand "rustup self update"
            }
        }
        Pop-Location

        $toolchainArg = ''
    }
    else {
        $toolchainArg = $toolchain
    }

    $attempts = 0

    while ($true) {
        $attempts++

        Invoke-LoggedCommand "rustup install --no-self-update $toolchainArg"

        if ($?) { break }

        if ($attempts -lt $MaxAttempts) {
            Write-Host "Install failed, attempt $attempts, retrying..."
        }
        else {
            Write-Host "Install failed after $attempts attempts."
            exit 1
        }

        # Failures to update are usually caused by file locks in Windows.
        # Sleep for a few seconds to give the blocking process a chance to release the lock.
        Start-Sleep -Seconds 3
    }

    if ($SetDefault) {
        if ($Toolchain -eq 'active') {
            $toolchainArg = rustup show active-toolchain -v | Select-Object -First 1
        }

        Invoke-LoggedCommand "rustup default $toolchainArg"
    }

    Invoke-LoggedCommand "rustup show"

  displayName: "Use Rust ${{ parameters.Toolchain }}"
  workingDirectory: ${{ parameters.WorkingDirectory }}
