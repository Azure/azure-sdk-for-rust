parameters:
  - name: Toolchain
    type: string
    # Expected values: 'stable', 'nightly', 'msrv', 'active' or a specific toolchain version
    # 'msrv' will read the MSRV from azure_core
    # 'active' will use the active toolchain for the working directory, which may come from
    #   a rustup directory override, rust-toolchain.toml, or the rustup default toolchain
    default: active
  - name: MaxAttempts
    type: number
    default: 3
  - name: WorkingDirectory
    type: string
    default: $(System.DefaultWorkingDirectory)
  - name: SetDefault
    type: boolean
    # When true, Use-Rust.ps1 sets a rustup directory override for WorkingDirectory.
    default: true
  - name: ConfigureRegistry
    type: boolean
    # When true, write $CARGO_HOME/config.toml so cargo resolves crates.io through the
    # azure-sdk-for-rust feed, and authenticate to it. Set to false on additional
    # invocations within the same job, which would otherwise redo identical work.
    default: true

steps:
- ${{ if parameters.ConfigureRegistry }}:
  # Cargo only reads config files from $CARGO_HOME or from ancestors of its working
  # directory, and it ignores environment variables for [source] replacement, so the
  # config has to be written to disk before cargo runs.
  - pwsh: |
      $cargoHome = $env:CARGO_HOME
      if (-not $cargoHome) { $cargoHome = Join-Path $HOME '.cargo' }
      New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null

      $configPath = Join-Path $cargoHome 'config.toml'
      Copy-Item `
        -Path '$(Build.SourcesDirectory)/eng/templates/config.toml.template' `
        -Destination $configPath `
        -Force

      Write-Host "Wrote cargo config to $configPath"
      Get-Content $configPath
      Write-Host "##vso[task.setvariable variable=CargoConfigPath]$configPath"
    displayName: Configure cargo to use the azure-sdk-for-rust feed

  - task: CargoAuthenticate@0
    displayName: Authenticate cargo to the azure-sdk-for-rust feed
    inputs:
      configFile: $(CargoConfigPath)

  # TEMPORARY DIAGNOSTIC - remove before this PR leaves draft.
  # Establishes which host rustup pulls toolchains from. `rustup check` only fetches
  # channel manifests, so it is cheap, and RUSTUP_LOG=rustup=debug makes it log the
  # full URL of every request.
  - pwsh: |
      foreach ($name in 'RUSTUP_DIST_SERVER', 'RUSTUP_UPDATE_ROOT', 'RUSTUP_HOME') {
        $value = [Environment]::GetEnvironmentVariable($name)
        if ($value) { Write-Host "$name = $value" }
        else { Write-Host "$name is unset (rustup uses its built-in default)" }
      }
      $env:RUSTUP_LOG = 'rustup=debug'
      rustup check 2>&1 | ForEach-Object { Write-Host $_ }
    displayName: "TEMP diagnostic: resolve rustup dist server"
    continueOnError: true

- task: PowerShell@2
  displayName: "Use Rust ${{ parameters.Toolchain }}"
  inputs:
    pwsh: true
    filePath: $(Build.SourcesDirectory)/eng/scripts/Use-Rust.ps1
    arguments: >
      -Toolchain '${{ parameters.Toolchain }}'
      -MaxAttempts ${{ parameters.MaxAttempts }}
      -SetDefault $${{ parameters.SetDefault }}
      -OutsideDirectory '$(Pipeline.Workspace)'
    workingDirectory: ${{ parameters.WorkingDirectory }}
