parameters:
  - name: Toolchain
    type: string
    # Expected values: 'stable', 'nightly', 'msrv', 'active' or a specific toolchain version
    # 'msrv' will read the MSRV from azure_core
    # 'active' will use the active toolchain for the working directory, which may come from
    #   a rustup directory override, rust-toolchain.toml, or the rustup default toolchain
    default: active
  - name: MaxAttempts
    type: number
    default: 3
  - name: WorkingDirectory
    type: string
    default: $(System.DefaultWorkingDirectory)
  - name: SetDefault
    type: boolean
    # When true, Use-Rust.ps1 sets a rustup directory override for WorkingDirectory.
    default: true
  - name: ConfigureRegistry
    type: boolean
    default: true

steps:
- ${{ if parameters.ConfigureRegistry }}:
  - pwsh: |
      $cargoHome = $env:CARGO_HOME
      if (-not $cargoHome) { $cargoHome = ([System.IO.Path]::Combine($HOME, '.cargo')) }
      New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null

      $configPath = ([System.IO.Path]::Combine($cargoHome, 'config.toml'))
      $config = Get-Content `
        -Path '$(Build.SourcesDirectory)/eng/templates/config.toml.template' `
        -Raw

      # Pull requests from forks run with a restricted System.AccessToken that cannot
      # authenticate to the feed, so CargoAuthenticate has nothing useful to hand cargo.
      # Drop `~force-auth` so those builds read the feed anonymously instead of failing on
      # the config.json probe. Anonymous callers only see crates already saved in the feed,
      # so a fork that adds a brand new dependency needs the feed populated first.
      if ($env:IS_FORK -eq 'true') {
        Write-Host "Fork build (System.PullRequest.IsFork='$env:IS_FORK'): reading the feed anonymously without '~force-auth'."
        $config = $config.Replace('azure-sdk-for-rust-public~force-auth', 'azure-sdk-for-rust-public')
      }
      else {
        Write-Host "Not a fork build (System.PullRequest.IsFork='$env:IS_FORK'): authenticating to the feed."
      }

      Set-Content -Path $configPath -Value $config -NoNewline

      Write-Host "Wrote cargo config to $configPath"
      Get-Content $configPath
      Write-Host "##vso[task.setvariable variable=CargoConfigPath]$configPath"
    displayName: Configure cargo to use the azure-sdk-for-rust feed
    env:
      IS_FORK: $(System.PullRequest.IsFork)

  # Skipped for forks, where the restricted token would be rejected by the feed anyway.
  - task: CargoAuthenticate@0
    displayName: Authenticate cargo to the azure-sdk-for-rust feed
    condition: and(succeeded(), ne(variables['System.PullRequest.IsFork'], 'True'))
    inputs:
      configFile: $(CargoConfigPath)

- task: PowerShell@2
  displayName: "Use Rust ${{ parameters.Toolchain }}"
  inputs:
    pwsh: true
    filePath: $(Build.SourcesDirectory)/eng/scripts/Use-Rust.ps1
    arguments: >
      -Toolchain '${{ parameters.Toolchain }}'
      -MaxAttempts ${{ parameters.MaxAttempts }}
      -SetDefault $${{ parameters.SetDefault }}
      -OutsideDirectory '$(Pipeline.Workspace)'
    workingDirectory: ${{ parameters.WorkingDirectory }}
