$schema: https://raw.githubusercontent.com/DavidAnson/markdownlint-cli2/v0.23.3/schema/markdownlint-cli2-config-schema.json
gitignore: true
ignores:
  - eng/common/
config:
  code-block-style:
    style: consistent
  line-length: false
  no-bare-urls: false
  no-duplicate-heading: false
  no-inline-html:
    allowed_elements:
      - "a"
      - "br"
      # Allowed for use in markdown tables.
      - "ol"
      - "ul"
      - "li"
  ol-prefix:
    style: ordered
  ul-style:
    style: dash
