name: GitHubActionsCredential Test

on:
  workflow_dispatch:
    inputs:
      tenant-id:
        description: Tenant ID of the Entra identity.
        required: true
      client-id:
        description: Client ID of the Entra identity.
        required: true
      scope:
        description: Token scope to request
        required: true
        default: https://management.azure.com/.default

permissions:
  contents: read
  id-token: write

jobs:
  authenticate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AZURE_TENANT_ID: ${{ inputs.tenant-id }}
      AZURE_CLIENT_ID: ${{ inputs.client-id }}
      AZURE_TEST_MODE: live
      TEST_SCOPE: ${{ inputs.scope }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        shell: pwsh
        run: ./eng/scripts/Use-Rust.ps1 -Toolchain stable

      - name: Test GitHub Actions credential
        run: cargo test --manifest-path sdk/identity/azure_identity/Cargo.toml --test github_actions_credential --all-features
