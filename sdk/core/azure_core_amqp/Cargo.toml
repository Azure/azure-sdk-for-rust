# AMQP Stack for consumption by packages in the Azure SDK.
[package]
name = "azure_core_amqp"
version = "1.2.0-beta.1"
description = "Rust client library for the AMQP protocol"
readme = "README.md"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/azure/azure-sdk-for-rust/sdk/core/azure_core_amqp"
documentation = "https://docs.rs/azure_core_amqp"

keywords = ["sdk", "cloud", "rest", "iot"]
categories = ["api-bindings"]

edition.workspace = true

[dependencies]
async-trait.workspace = true
azure_core = { path = "../azure_core", version = "1.2.0-beta.1", default-features = false }
fe2o3-amqp = { workspace = true, optional = true }
fe2o3-amqp-ws = { workspace = true, optional = true }
fe2o3-amqp-cbs = { workspace = true, optional = true }
fe2o3-amqp-ext = { workspace = true, optional = true }
fe2o3-amqp-management = { workspace = true, optional = true }
fe2o3-amqp-types = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_amqp = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
tokio.workspace = true
tracing.workspace = true
typespec = { path = "../typespec", version = "1.2.0-beta.1" }
typespec_macros = { path = "../typespec_macros", version = "1.1.0-beta.1" }

[dev-dependencies]
serde_json.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
default = ["fe2o3_amqp", "fe2o3-amqp/native-tls", "websockets_rustls"]
ffi = []
test = []
fe2o3_amqp = [
  "dep:fe2o3-amqp",
  "fe2o3-amqp-types",
  "fe2o3-amqp-ext",
  "fe2o3-amqp-management",
  "fe2o3-amqp-cbs",
  "serde_amqp",
  "serde_bytes",
  "azure_core/tokio",
]
# AMQP over WebSockets, in two flavors that differ only in the TLS stack.
# `fe2o3-amqp-ws` puts its connect entry point behind its own TLS features, so
# this crate forwards one of them and offers both stacks. Enable one of these.
# `websockets_rustls` is the default and matches the TLS stack in `sdk/core`:
# rustls with the aws-lc-rs provider. The direct `rustls` dependency selects
# that provider, because `fe2o3-amqp-ws` takes rustls without default features.
# Enabling both flavors is allowed; `fe2o3-amqp-ws` then uses native-tls.
websockets_rustls = [
  "fe2o3_amqp",
  "dep:fe2o3-amqp-ws",
  "fe2o3-amqp-ws/rustls-tls-native-roots",
  "dep:rustls",
]
websockets_native_tls = [
  "fe2o3_amqp",
  "dep:fe2o3-amqp-ws",
  "fe2o3-amqp-ws/native-tls",
]

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["fe2o3_amqp", "websockets_rustls"]
