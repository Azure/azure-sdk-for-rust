# AMQP Stack for consumption by packages in the Azure SDK.
[package]
name = "azure_core_amqp"
version = "1.2.0-beta.1"
description = "Rust client library for the AMQP protocol"
readme = "README.md"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/azure/azure-sdk-for-rust/sdk/core/azure_core_amqp"
documentation = "https://docs.rs/azure_core_amqp"

keywords = ["sdk", "cloud", "rest", "iot"]
categories = ["api-bindings"]

edition.workspace = true

[dependencies]
async-trait.workspace = true
azure_core = { path = "../azure_core", version = "1.2.0-beta.1", default-features = false }
fe2o3-amqp = { workspace = true, optional = true }
fe2o3-amqp-ws = { workspace = true, optional = true }
fe2o3-amqp-cbs = { workspace = true, optional = true }
fe2o3-amqp-ext = { workspace = true, optional = true }
fe2o3-amqp-management = { workspace = true, optional = true }
fe2o3-amqp-types = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_amqp = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
tokio.workspace = true
tracing.workspace = true
typespec = { path = "../typespec", version = "1.2.0-beta.1" }
typespec_macros = { path = "../typespec_macros", version = "1.1.0-beta.1" }

[dev-dependencies]
serde_json.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
default = [
  "fe2o3_amqp",
  "fe2o3_amqp_native_tls",
  "fe2o3_amqp_ws",
  "fe2o3_amqp_ws_rustls",
]
ffi = []
test = []
fe2o3_amqp = [
  "dep:fe2o3-amqp",
  "fe2o3-amqp-types",
  "fe2o3-amqp-ext",
  "fe2o3-amqp-management",
  "fe2o3-amqp-cbs",
  "serde_amqp",
  "serde_bytes",
  "azure_core/tokio",
]
# The TLS stack for AMQP framed directly on TCP (`amqps://`, port 5671).
# `fe2o3_amqp` is the base, and this feature adds the stack, in the same shape as
# the WebSocket features below. native-tls is the only choice, because the rustls
# backend of `fe2o3-amqp` 0.14 pulls in `ring`, which `deny.toml` bans (#4189).
fe2o3_amqp_native_tls = ["fe2o3_amqp", "fe2o3-amqp/native-tls"]
# AMQP over WebSockets. The base `fe2o3_amqp_ws` feature turns on the transport
# code and the `fe2o3-amqp-ws` dependency, and it does not select a TLS stack.
# Add one of the two modifier features to select a stack. This is the shape that
# `azure_core` uses for HTTP, where `reqwest` is the base and `reqwest_rustls`
# adds the TLS stack.
# `fe2o3_amqp_ws_rustls` is the default and matches the TLS stack in `sdk/core`:
# rustls with the aws-lc-rs provider. The direct `rustls` dependency selects
# that provider, because `fe2o3-amqp-ws` takes rustls without default features.
# The features are additive, so both modifiers can be on at the same time.
# `fe2o3-amqp-ws` then uses native-tls, and the connection logs a warning.
fe2o3_amqp_ws = ["fe2o3_amqp", "dep:fe2o3-amqp-ws"]
fe2o3_amqp_ws_rustls = [
  "fe2o3_amqp_ws",
  "fe2o3-amqp-ws/rustls-tls-native-roots",
  "dep:rustls",
]
fe2o3_amqp_ws_native_tls = [
  "fe2o3_amqp_ws",
  "fe2o3-amqp-ws/native-tls",
]

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["fe2o3_amqp", "fe2o3_amqp_ws", "fe2o3_amqp_ws_rustls"]
