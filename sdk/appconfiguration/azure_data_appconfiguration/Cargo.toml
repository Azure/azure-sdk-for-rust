[package]
name = "azure_data_appconfiguration"
version = "0.1.0"
description = "Microsoft Azure App Configuration client library for Rust"
readme = "README.md"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage = "https://github.com/azure/azure-sdk-for-rust"
documentation = "https://docs.rs/azure_data_appconfiguration"
keywords = ["sdk", "cloud", "configuration"]
categories = ["api-bindings"]
exclude.workspace = true

[features]
default = ["azure_core/default"]

[dependencies]
async-trait = { workspace = true }
# Recorded tests exchange Azure Core types with the local test infrastructure.
azure_core = { path = "../../core/azure_core", version = "1.2.0-beta.2", default-features = false }
serde = { workspace = true }

[dev-dependencies]
azure_core_test = { path = "../../core/azure_core_test", features = ["tracing"] }
azure_identity = { path = "../../identity/azure_identity" }
futures.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
