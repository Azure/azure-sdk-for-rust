# Local observability stack for the Cosmos Rust SDK WS9 soak.
#
# Copyright (c) Microsoft Corporation. All rights reserved.
# Licensed under the MIT License.
#
# Brings up an OpenTelemetry Collector (OTLP in -> Prometheus scrape out),
# Prometheus (stores the metrics), and Grafana (auto-provisioned with the
# Prometheus datasource and the checked-in WS9 dashboard).
#
#   docker compose up -d
#
# Point the soak harness at the collector. The harness exports OTLP/gRPC and does
# NOT read the standard OTEL_* environment variables, so pass the endpoint via its
# own flags (the :4318 HTTP port is exposed for other OTLP/HTTP clients):
#   cargo run -p azure_data_cosmos_observability_harness --features otlp -- \
#     --exporter otlp --otlp-endpoint http://localhost:4317
#
# Grafana:    http://localhost:3000  (admin / admin)
# Prometheus: http://localhost:9090
#
# Image tags are pinned for reproducibility; bump them as needed.

# cspell:ignore otelcol
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.0
    container_name: cosmos-ws9-otelcol
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # Bind to loopback only: this is a local dev stack with unauthenticated
      # OTLP ingest and collector metrics, so it must not be reachable from other
      # hosts. The harness on the same host still connects via localhost.
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:8889:8889"   # Prometheus scrape endpoint (SDK metrics)
      - "127.0.0.1:8888:8888"   # Collector's own internal metrics
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: cosmos-ws9-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Loopback only — the collected Cosmos telemetry (database/container names,
      # endpoint labels) must not be exposed to the surrounding network.
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: cosmos-ws9-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Auto-open the WS9 dashboard on login.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cosmos-observability.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # The checked-in dashboards directory is mounted read-only and
      # auto-loaded by the dashboards provider below.
      - ../dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Loopback only — the fixed admin/admin credential means this must not be
      # reachable from other machines on a shared dev host.
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
