# OpenTelemetry Collector config for the Cosmos Rust SDK WS9 soak.
#
# Copyright (c) Microsoft Corporation. All rights reserved.
# Licensed under the MIT License.
#
# Pipeline: OTLP (from the SDK) -> batch -> Prometheus scrape endpoint (:8889)
# which Prometheus scrapes. `resource_to_telemetry_conversion` copies resource
# attributes (service.name, service.instance.id, ...) onto every metric as
# labels so they are queryable in Grafana. The harness also exports tail-sampled
# spans over the same OTLP endpoint, so a `traces` pipeline routes them to the
# debug exporter — this is where the "rich on error" span burst is observed
# (there is no trace backend in this minimal stack). Sampled *log* lines are NOT
# exported over OTLP; the SDK's `SamplingLogHandler` emits them through the
# harness's local `tracing` output (console), so they never reach the collector.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Small batches keep the soak's steady-state overhead low while staying
  # responsive during an injected fault window.
  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    enable_open_metrics: true
    # Turn OTLP resource attributes into metric labels.
    resource_to_telemetry_conversion:
      enabled: true

  # Human-readable sample of what the SDK is emitting; handy when verifying the
  # metrics pipeline. `normal` keeps steady-state metric logging compact.
  debug:
    verbosity: normal

  # Detailed marshaler for traces: `normal` omits parent span IDs and timestamps,
  # so the backdated retry tree the runbook root-causes from would be invisible.
  # Kept separate from metrics so it does not flood the steady-state metric log.
  debug/traces:
    verbosity: detailed

service:
  telemetry:
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    # Tail-sampled spans from the harness surface here. There is no trace backend
    # in this minimal stack, so route them to the detailed debug exporter — the
    # "rich on error" span burst (with parent IDs + timestamps) shows up in
    # `docker compose logs otel-collector`. Swap in a Jaeger/Tempo/OTLP exporter
    # to forward spans to a real trace UI.
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug/traces]
