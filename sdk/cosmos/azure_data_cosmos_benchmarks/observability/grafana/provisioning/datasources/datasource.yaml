apiVersion: 1

datasources:
  - name: Prometheus
    uid: cosmos-ws9-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 5s
