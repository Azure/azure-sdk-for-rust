# cspell:ignore LIBPATH Signtool vswhere

parameters:
  - name: UsePlatformContainer
    type: boolean
  - name: OSName
    type: string
  - name: Matrix
    type: object
  - name: DependsOn
    type: string
  - name: CloudConfig
    type: object

jobs:
  - job:
    displayName: Build native driver
    dependsOn: ${{ parameters.DependsOn }}
    condition: and(succeeded(), ne(${{ parameters.Matrix }}, '{}'))
    strategy:
      matrix: $[ ${{ parameters.Matrix }} ]
    pool:
      name: $(Pool)
      ${{ if eq(parameters.OSName, 'macOS') }}:
        vmImage: $(OSVmImage)
      ${{ else }}:
        image: $(OSVmImage)
      os: ${{ parameters.OSName }}
    steps:
      - template: /eng/pipelines/templates/steps/use-ms-rust.yml@self
        parameters:
          TargetTriple: $(Triple)

      - ${{ if eq(parameters.OSName, 'windows') }}:
        - pwsh: |
            if ('$(PublicationKind)' -eq 'windows-dll') {
              $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
              $installation = & $vswhere -latest -products * `
                -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
              if (-not $installation) {
                throw 'Visual Studio ARM64 MSVC build tools were not found.'
              }
              $devShell = Join-Path $installation 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll'
              Import-Module $devShell
              Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation `
                -DevCmdArguments '-arch=arm64 -host_arch=amd64'
              foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir')) {
                Write-Host "##vso[task.setvariable variable=$name]$([Environment]::GetEnvironmentVariable($name))"
              }
              if (-not (Get-Command link.exe -CommandType Application -ErrorAction SilentlyContinue)) {
                throw 'MSVC ARM64 linker is unavailable after Visual Studio initialization.'
              }
              exit 0
            }

            $mingwBin = 'C:\msys64\mingw64\bin'
            if (-not (Test-Path $mingwBin -PathType Container)) {
              throw "MSYS2 MinGW64 toolchain directory was not found: $mingwBin"
            }

            Write-Host "##vso[task.prependpath]$mingwBin"
            $env:PATH = "$mingwBin;$env:PATH"
            foreach ($tool in @('gcc', 'ar')) {
              if (-not (Get-Command $tool -CommandType Application -ErrorAction SilentlyContinue)) {
                throw "Required MSYS2 tool is unavailable: $tool"
              }
            }
          displayName: Configure Windows native toolchain

      - ${{ if eq(parameters.OSName, 'linux') }}:
        - bash: |
            set -euo pipefail

            case "$(TargetId)" in
              linux-amd64-glibc)
                ;;
              linux-arm64-glibc)
                sudo apt-get update
                sudo apt-get install -yq gcc-aarch64-linux-gnu libc6-dev-arm64-cross
                ;;
              linux-amd64-musl)
                sudo apt-get update
                sudo apt-get install -yq musl-dev musl-tools
                ;;
              linux-arm64-musl)
                toolchain_root="$(Agent.TempDirectory)/aarch64-linux-musl"
                toolchain_archive="$(Agent.TempDirectory)/aarch64-linux-musl-gcc-10.3.0.tar.gz"
                mkdir -p "$toolchain_root"
                curl -sSL \
                  "https://github.com/microsoft/vscode-linux-build-agent/releases/download/v20260212-405735/aarch64-linux-musl-gcc-10.3.0.tar.gz" \
                  -o "$toolchain_archive"
                echo "58cd59ee4038291fe8a7f4adccac0ecbe8d23cbad1cb650b381e45e7e1e22424  $toolchain_archive" |
                  sha256sum --check
                tar -xzf "$toolchain_archive" -C "$toolchain_root"
                echo "##vso[task.prependpath]$toolchain_root/output/bin"
                export PATH="$toolchain_root/output/bin:$PATH"
                ;;
              *)
                echo "Unsupported Linux native-driver target: $(TargetId)" >&2
                exit 2
                ;;
            esac

            command -v "$(CCompiler)"
          displayName: Install Linux compiler for $(TargetId)

      - pwsh: cargo install cargo-auditable --locked
        displayName: Install cargo-auditable

      - pwsh: >
          $(pipelineDir)/Build-NativeMatrix.ps1
          -TargetId $(TargetId)
          -OutputRoot $(Build.ArtifactStagingDirectory)/native
          -CCompiler $(CCompiler)
          -StaticOnly
        displayName: Build $(TargetId) (static library + metadata)
        condition: and(succeeded(), eq(variables['PublicationKind'], 'static-go-module'))

      - pwsh: >
          $(pipelineDir)/Build-NativeMatrix.ps1
          -TargetId $(TargetId)
          -OutputRoot $(Build.ArtifactStagingDirectory)/native
          -CCompiler $(CCompiler)
        displayName: Build $(TargetId) (DLL + PDB + metadata)
        condition: and(succeeded(), eq(variables['PublicationKind'], 'windows-dll'))

      - task: EsrpCodeSigning@5
        displayName: Authenticode sign and verify azurecosmosdriver.dll
        condition: and(succeeded(), eq(variables['PublicationKind'], 'windows-dll'))
        inputs:
          ConnectedServiceName: $(CosmosNativeSigningServiceConnection)
          AppRegistrationClientId: $(CosmosNativeSigningClientId)
          AppRegistrationTenantId: $(CosmosNativeSigningTenantId)
          AuthAKVName: $(CosmosNativeSigningKeyVault)
          AuthCertName: $(CosmosNativeSigningAuthCertificate)
          AuthSignCertName: $(CosmosNativeSigningCertificate)
          FolderPath: $(Build.ArtifactStagingDirectory)/native/$(TargetId)
          Pattern: azurecosmosdriver.dll
          signConfigType: inlineSignParams
          inlineOperation: >-
            [
              {
                "KeyCode": "CP-230012",
                "OperationCode": "SigntoolSign",
                "Parameters": {
                  "OpusName": "Microsoft",
                  "OpusInfo": "https://www.microsoft.com",
                  "FileDigest": "/fd SHA256",
                  "PageHash": "/NPH",
                  "TimeStamp": "/tr http://timestamp.acs.microsoft.com /td sha256"
                },
                "ToolName": "sign",
                "ToolVersion": "1.0"
              },
              {
                "KeyCode": "CP-230012",
                "OperationCode": "SigntoolVerify",
                "Parameters": {
                  "VerifyAll": "/pa /all"
                },
                "ToolName": "sign",
                "ToolVersion": "1.0"
              }
            ]

      - pwsh: >
          $(pipelineDir)/Finalize-WindowsArm64Artifact.ps1
          -ArtifactRoot $(Build.ArtifactStagingDirectory)/native/$(TargetId)
        displayName: Verify and finalize signed Windows ARM64 payload
        condition: and(succeeded(), eq(variables['PublicationKind'], 'windows-dll'))

      - pwsh: |
          $source = "$(Build.ArtifactStagingDirectory)/native/$(TargetId)"
          $metadata = Get-Content `
            (Join-Path $source 'rust-driver-native-interface-metadata.json') `
            -Raw | ConvertFrom-Json
          $destination = Join-Path `
            "$(Build.ArtifactStagingDirectory)/windows-arm64-release" `
            "windows-arm64-msvc/v$($metadata.native_interface_version)"
          New-Item -ItemType Directory -Force $destination | Out-Null
          foreach ($filename in @(
            'azurecosmosdriver.dll',
            'azurecosmosdriver.pdb',
            'azurecosmosdriver.h',
            'rust-driver-native-interface-metadata.json',
            'SHA256SUMS'
          )) {
            Copy-Item (Join-Path $source $filename) $destination
          }
        displayName: Stage versioned Windows ARM64 release
        condition: and(succeeded(), eq(variables['PublicationKind'], 'windows-dll'))

      - task: GoTool@0
        displayName: Install Go $(GoToolchainVersion)
        inputs:
          version: $(GoToolchainVersion)
        condition: and(succeeded(), eq(variables['PublicationKind'], 'static-go-module'))

      - pwsh: >
          $(pipelineDir)/Test-NativeLink.ps1
          -TargetId $(TargetId)
          -ArtifactRoot $(Build.ArtifactStagingDirectory)/native
          -CCompiler $(CCompiler)
        displayName: Link smoke test $(TargetId)
        env:
          GOTOOLCHAIN: local
        condition: and(succeeded(), eq(variables['PublicationKind'], 'static-go-module'))

      - ${{ if eq(parameters.OSName, 'windows') }}:
        - template: /eng/common/pipelines/templates/steps/publish-1es-artifact.yml
          parameters:
            ArtifactName: native-$(TargetId)
            ArtifactPath: $(Build.ArtifactStagingDirectory)/windows-arm64-release
            SbomEnabled: true
      - ${{ else }}:
        - template: /eng/common/pipelines/templates/steps/publish-1es-artifact.yml
          parameters:
            ArtifactName: native-$(TargetId)
            ArtifactPath: $(Build.ArtifactStagingDirectory)/native/$(TargetId)
            SbomEnabled: true
