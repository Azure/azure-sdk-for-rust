# =============================================================================
# native-driver.yml  --  Cosmos native-driver cross-build + signing/provenance
#
#   STATUS: SKELETON / UNWIRED. This pipeline is intentionally NOT referenced by
#   sdk/cosmos/ci*.yml or any pr.yml trigger. It cannot run until an owner wires
#   it into a pipeline definition in the internal project. Do not enable triggers
#   or add it to CI without explicit sign-off (Hard Gate).
#
#   It productizes the manual windows/amd64 bootstrap (Azure/azure-cosmos-driver
#   PR #5) into the full "Big 5 + musl" matrix. See ./README.md and
#   ../docs/NATIVE_SUPPLY_CHAIN.md for the security/provenance design.
# =============================================================================

trigger: none
pr: none

parameters:
  - name: targets
    type: object
    default:
      - { id: windows-amd64,      pool: windows, triple: x86_64-pc-windows-gnu,    enabled: true }
      - { id: windows-arm64,      pool: windows, triple: aarch64-pc-windows-gnu,   enabled: false } # RISK: unsupported Rust target; investigate gnullvm/msvc
      - { id: linux-amd64-glibc,  pool: linux,   triple: x86_64-unknown-linux-gnu, enabled: true }
      - { id: linux-arm64-glibc,  pool: linux,   triple: aarch64-unknown-linux-gnu, enabled: true }
      - { id: linux-amd64-musl,   pool: linux,   triple: x86_64-unknown-linux-musl, enabled: true }
      - { id: linux-arm64-musl,   pool: linux,   triple: aarch64-unknown-linux-musl, enabled: true }
      - { id: darwin-arm64,       pool: macos,   triple: aarch64-apple-darwin,      enabled: true }

variables:
  crateDir: sdk/cosmos/azure_data_cosmos_driver_native
  pipelineDir: sdk/cosmos/azure_data_cosmos_driver_native/pipeline

stages:
  # ---------------------------------------------------------------------------
  # 1. Build each target: capture syslibs, build the .a with cargo-auditable,
  #    emit per-artifact rust-driver-native-interface-metadata.json (Deliverable 1).
  # ---------------------------------------------------------------------------
  - stage: build
    displayName: Cross-build native matrix
    jobs:
      - ${{ each t in parameters.targets }}:
          - job: build_${{ replace(t.id, '-', '_') }}
            displayName: build ${{ t.id }}
            condition: ${{ eq(t.enabled, true) }}
            pool: { name: $(pool-${{ t.pool }}) } # TODO: map to real 1ES managed pools per OS
            steps:
              - pwsh: eng/scripts/Install-RustToolchains.ps1
                displayName: Install Rust toolchain
              - pwsh: cargo install cargo-auditable --locked
                displayName: Install cargo-auditable
              # TODO(preflight): install the cross-linker for ${{ t.triple }}
              #   *-pc-windows-gnu -> mingw-w64 ; *-linux-musl -> musl-gcc ;
              #   *-linux-gnu cross -> gcc-<arch>-linux-gnu ; darwin -> Apple SDK.
              - pwsh: >
                  $(pipelineDir)/Build-NativeMatrix.ps1
                  -TargetId ${{ t.id }}
                  -OutputRoot $(Build.ArtifactStagingDirectory)/native
                displayName: Build ${{ t.id }} (native libraries + metadata)
              - template: /eng/common/pipelines/templates/steps/publish-1es-artifact.yml
                parameters:
                  ArtifactName: native-${{ t.id }}
                  ArtifactPath: $(Build.ArtifactStagingDirectory)/native/${{ t.id }}
                  # 1ES auto-injects the SBOM manifest (sbomEnabled default true on internal).

  # ---------------------------------------------------------------------------
  # 2. Sign the DYNAMIC libs per OS (ESRP). The static .a is NOT signable here;
  #    its trust comes from SBOM + provenance + published SHA256 (see doc).
  # ---------------------------------------------------------------------------
  - stage: sign
    displayName: ESRP sign dynamic libs
    dependsOn: build
    jobs:
      - job: sign_windows
        displayName: Authenticode sign azurecosmosdriver.dll
        pool: { name: $(pool-windows) }
        steps:
          # TODO: ESRPCodeSigning@5 with an Authenticode cert profile (NOT the
          # EsrpRelease@11 crate-publish flow used by archetype-rust-release.yml).
          - pwsh: Write-Host "TODO: Authenticode-sign the Windows .dll artifacts"
            displayName: (placeholder) Authenticode
      - job: sign_macos
        displayName: codesign + notarize libazurecosmosdriver.dylib
        pool: { name: $(pool-macos) }
        steps:
          # TODO: ESRP Mac signing profile: codesign (Developer ID) then notarize + staple.
          - pwsh: Write-Host "TODO: codesign + notarize the macOS .dylib artifacts"
            displayName: (placeholder) codesign
      # Linux: no artifact-signing standard. Trust = SBOM + provenance + SHA256.

  # ---------------------------------------------------------------------------
  # 3. Fail closed until Cargo-aware SBOM and trusted provenance are wired.
  #    The local rehearsal proves the formats, but production must replace its
  #    unsigned statement with a 1ES-attested builder identity.
  # ---------------------------------------------------------------------------
  - stage: security_evidence
    displayName: Generate SBOM + trusted provenance
    dependsOn: [build, sign]
    jobs:
      - job: evidence
        displayName: Supply-chain evidence gate
        pool: { name: $(pool-linux) }
        steps:
          - pwsh: |
              throw @"
              UNWIRED SECURITY GATE:
              - generate the Cargo-aware CycloneDX SBOM per native target;
              - generate a signed 1ES/SLSA provenance attestation;
              - verify both before the Go publication stage.
              "@
            displayName: Block until trusted evidence is configured

  # ---------------------------------------------------------------------------
  # 4. Generate the per-target Go modules (Deliverable 2) and publish the
  #    azure-cosmos-driver layout + SHA256SUMS. Publishing to the remote repo is
  #    a SEPARATE, gated release step — never automatic from this skeleton.
  # ---------------------------------------------------------------------------
  - stage: gomodules
    displayName: Generate Go modules + SHA256SUMS
    dependsOn: security_evidence
    jobs:
      - job: generate
        displayName: New-GoModules
        pool: { name: $(pool-linux) }
        steps:
          - download: current
          - pwsh: |
              $artifactRoot = "$(Pipeline.Workspace)/native"
              New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
              Get-ChildItem "$(Pipeline.Workspace)" -Directory -Filter "native-*" |
                ForEach-Object {
                  $targetId = $_.Name.Substring("native-".Length)
                  $destination = Join-Path $artifactRoot $targetId
                  New-Item -ItemType Directory -Force -Path $destination | Out-Null
                  Copy-Item (Join-Path $_.FullName "*") $destination -Recurse -Force
                }
            displayName: Normalize downloaded native artifact layout
          - pwsh: >
              $(pipelineDir)/New-GoModules.ps1
              -ArtifactRoot $(Pipeline.Workspace)/native
              -OutputRoot   $(Build.ArtifactStagingDirectory)/azure-cosmos-driver
            displayName: Emit go.mod + link_*.go + native/
          - pwsh: |
              $root = "$(Build.ArtifactStagingDirectory)/azure-cosmos-driver"
              Get-ChildItem -Recurse -Filter libazurecosmosdriver.a $root |
                ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.FullName.Substring($root.Length+1))" } |
                Set-Content "$root/SHA256SUMS"
            displayName: Write SHA256SUMS (published out of the trusted build)
          - template: /eng/common/pipelines/templates/steps/publish-1es-artifact.yml
            parameters:
              ArtifactName: azure-cosmos-driver-modules
              ArtifactPath: $(Build.ArtifactStagingDirectory)/azure-cosmos-driver
          # TODO(gated): a manual-approval release job pushes the generated layout
          # to github.com/Azure/azure-cosmos-driver. Requires explicit sign-off.
