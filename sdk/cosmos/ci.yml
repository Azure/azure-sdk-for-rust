# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/cosmos/

parameters:
- name: RunLiveTests
  displayName: Run live tests
  type: boolean
  default: false
- name: release_azure_data_cosmos_macros
  displayName: azure_data_cosmos_macros
  type: boolean
  default: false
- name: release_azure_data_cosmos_driver
  displayName: azure_data_cosmos_driver
  type: boolean
  default: false
- name: release_azure_data_cosmos
  displayName: azure_data_cosmos
  type: boolean
  default: false

extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: cosmos
    # macOS/Windows live-test legs need ~63-65 min; raise from the 60-min default
    # so they finish instead of being cancelled at the agent cap.
    TestTimeoutInMinutes: 90
    RunLiveTests: ${{ or(parameters.RunLiveTests, eq(variables['Build.Reason'], 'Schedule'), endsWith(variables['Build.DefinitionName'], '- weekly')) }}
    Artifacts:
    - name: azure_data_cosmos_macros
      releaseInBatch: ${{ parameters.release_azure_data_cosmos_macros }}
    - name: azure_data_cosmos_driver
      releaseInBatch: ${{ parameters.release_azure_data_cosmos_driver }}
    - name: azure_data_cosmos
      releaseInBatch: ${{ parameters.release_azure_data_cosmos }}
    CloudConfig:
      Public:
        ServiceConnection: azure-sdk-tests-cosmos
    EnvVars:
      RUST_TEST_THREADS: '1'
      RUST_BACKTRACE: '1'
      # Live budget for the binary-encoding round-trip fuzzer
      # (azure_data_cosmos/tests/binary_roundtrip_fuzzer.rs). Only consumed on
      # the `binary_encoding` live leg (live-legacy-arm-matrix.json); a no-op
      # elsewhere. Each iteration exercises 3 encoding configs; every config runs
      # 4 point ops + 1 single-partition query + 1 cross-partition ORDER BY
      # query, and the pure-`binary` config adds a typed wide-integer probe of
      # 3 more round-trips (upsert, point read, ORDER BY). That is 3*6 + 3 = 21
      # per iteration, so 180 => ~3800.
      #
      # Treat that as a floor, not a total. It counts only the calls the fuzzer
      # makes by name: it does not count the query-plan request a
      # cross-partition query issues, nor the partition-key-range lookups, nor
      # the per-partition fan-out of an ORDER BY (one page fetch per physical
      # partition, not one per query). The real request count is higher by a
      # factor that depends on the container's partition count, so size the
      # budget by wall clock rather than by this number.
      #
      # ORDER BY runs on every config so the control exercises the same surface
      # as the experiment (#4976); it previously ran only on pure `binary`, which
      # left an ORDER BY failure unattributable. Iterations dropped 200 => 180 to
      # hold the total round-trip count roughly flat while paying for that
      # coverage.
      #
      # Neither count has been timed against a full live run; the leg already
      # needs ~63-65 min of the 90-min cap, so if it starts being cancelled,
      # lower this first. Raise it for a deeper soak.
      AZURE_COSMOS_FUZZ_ITERATIONS: '180'
      # Enable the wide-number generator (integers at or beyond 2^53, where the
      # service's number model stores the value as an IEEE-754 double). Without
      # this the fuzzer never covers the precision boundary it exists to guard.
      AZURE_COSMOS_FUZZ_WIDE_NUMBERS: 'true'
      AZURE_COSMOS_GW_V2_ENDPOINT: $(thinclient-test-endpoint)
      AZURE_COSMOS_GW_V2_KEY: $(thinclient-test-key)
      AZURE_COSMOS_GW_V2_MULTI_REGION_ENDPOINT: $(thin-client-canary-multi-region-session-endpoint)
      AZURE_COSMOS_GW_V2_MULTI_REGION_KEY: $(thin-client-canary-multi-region-session-key)
    VariableGroups:
    - 'Test Secrets for Cosmos Live Tests - user administered'
    MatrixConfigs:
      - Name: Cosmos_release
        Path: sdk/cosmos/release-platform-matrix.json
        Selection: sparse
        NonSparseParameters: RustToolchainName
        GenerateVMJobs: true
      # Emulator jobs run only in Build. `MatrixConfigs` (unlike
      # `AdditionalMatrixConfigs`) is never consumed by the live-test stage in
      # archetype-sdk-client.yml, so these entries don't enter live stages,
      # deploy Azure resources, or replace live-test credentials with local
      # endpoints.
      - Name: Cosmos_vnext_emulator
        Path: sdk/cosmos/vnext-emulator-matrix.json
        Selection: all
        GenerateVMJobs: true
      - Name: Cosmos_inmemory_emulator
        # Both blocking jobs use port-zero host configs. Test setup parses the
        # ready record and exports the OS-assigned account and management URLs.
        Path: sdk/cosmos/inmemory-emulator-matrix.json
        Selection: all
        GenerateVMJobs: true
    # Cosmos_live_test runs against fixed, self-owned accounts (see
    # sdk/cosmos/pipeline/README.md) instead of resources deployed fresh each run,
    # so it lives in FixedAccountMatrixConfigs rather than LiveTestMatrixConfigs.
    # PreTestRunSteps resolves the account selected by each matrix leg's
    # AccountSelector from the rust-ci secret, in place of
    # ARM deployment (DisableAzureResourceCreation: true is set automatically for
    # this leg by archetype-sdk-client.yml).
    FixedAccountMatrixConfigs:
      - Name: Cosmos_live_test
        Path: sdk/cosmos/live-platform-matrix.json
        Selection: sparse
        GenerateVMJobs: true
    PreTestRunSteps:
      - template: /sdk/cosmos/pipeline/resolve-test-account-steps.yml
        parameters:
          AccountSelector: $(AccountSelector)
    LiveTestMatrixConfigs:
      # Legs that still use ARM-deployed per-run Cosmos accounts (not migrated
      # to fixed self-owned accounts):
      #   * Thin-client (GatewayV2) legs use $(thinclient-test-endpoint)/
      #     $(thinclient-test-key) for the thin-client itself, but their primary
      #     client still needs an ARM-provisioned account.
      #   * Binary-encoding round-trip fuzz leg exercises encoding boundaries
      #     against a fresh account and is short-lived.
      # Left on the legacy per-run path intentionally.
      - Name: Cosmos_live_arm
        Path: sdk/cosmos/live-legacy-arm-matrix.json
        Selection: all
        GenerateVMJobs: true
      # Dedicated live leg that runs the full integration suite with the primary
      # (data-plane) client authenticated via Entra ID (AAD) instead of the
      # account key. `AZURE_COSMOS_AUTH_MODE=aad` surfaces as a job env var and
      # is read by the test framework (tests/framework/test_client.rs), which
      # then uses AAD for data-plane operations and the account key only for
      # database create/delete. Pinned to a single consistency config on Linux
      # to bound live-account cost.
      - Name: Cosmos_live_test_aad
        Path: sdk/cosmos/live-aad-platform-matrix.json
        Selection: all
        GenerateVMJobs: true
