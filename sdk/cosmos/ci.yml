# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/cosmos/

pr:
  branches:
    include:
    - main
    - feature/*
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/cosmos/azure_data_cosmos_driver_native/pipeline/

parameters:
- name: RunLiveTests
  displayName: Run live tests
  type: boolean
  default: false
- name: release_azure_data_cosmos_macros
  displayName: azure_data_cosmos_macros
  type: boolean
  default: false
- name: release_azure_data_cosmos_driver
  displayName: azure_data_cosmos_driver
  type: boolean
  default: false
- name: release_azure_data_cosmos
  displayName: azure_data_cosmos
  type: boolean
  default: false

extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: cosmos
    AdditionalBuildJobs:
      - template: /sdk/cosmos/azure_data_cosmos_driver_native/pipeline/native-driver-pr-validation.yml
    # macOS/Windows live-test legs need ~63-65 min; raise from the 60-min default
    # so they finish instead of being cancelled at the agent cap.
    TestTimeoutInMinutes: 90
    RunLiveTests: ${{ or(parameters.RunLiveTests, eq(variables['Build.Reason'], 'Schedule'), endsWith(variables['Build.DefinitionName'], '- weekly')) }}
    Artifacts:
    - name: azure_data_cosmos_macros
      releaseInBatch: ${{ parameters.release_azure_data_cosmos_macros }}
    - name: azure_data_cosmos_driver
      releaseInBatch: ${{ parameters.release_azure_data_cosmos_driver }}
    - name: azure_data_cosmos
      releaseInBatch: ${{ parameters.release_azure_data_cosmos }}
    CloudConfig:
      Public:
        ServiceConnection: azure-sdk-tests-cosmos
    EnvVars:
      RUST_TEST_THREADS: '1'
      RUST_BACKTRACE: '1'
      # Live budget for the binary-encoding round-trip fuzzer
      # (azure_data_cosmos/tests/binary_roundtrip_fuzzer.rs). Only consumed on
      # the `binary_encoding` live leg (live-platform-matrix.json); a no-op
      # elsewhere. Each iteration exercises 3 encoding configs x 4 point ops, so
      # 200 => ~2400 round-trips — bounded to fit the live-test time cap. Bump it
      # for a deeper soak.
      AZURE_COSMOS_FUZZ_ITERATIONS: '200'
      # Enable the wide-number generator (integers at or beyond 2^53, where the
      # service's number model stores the value as an IEEE-754 double). Without
      # this the fuzzer never covers the precision boundary it exists to guard.
      AZURE_COSMOS_FUZZ_WIDE_NUMBERS: 'true'
      AZURE_COSMOS_GW_V2_ENDPOINT: $(thinclient-test-endpoint)
      AZURE_COSMOS_GW_V2_KEY: $(thinclient-test-key)
      AZURE_COSMOS_GW_V2_MULTI_REGION_ENDPOINT: $(thin-client-canary-multi-region-session-endpoint)
      AZURE_COSMOS_GW_V2_MULTI_REGION_KEY: $(thin-client-canary-multi-region-session-key)
    VariableGroups:
    - 'Test Secrets for Cosmos Live Tests - user administered'
    MatrixConfigs:
      - Name: Cosmos_release
        Path: sdk/cosmos/release-platform-matrix.json
        Selection: sparse
        NonSparseParameters: RustToolchainName
        GenerateVMJobs: true
      # Emulator jobs run only in Build. `MatrixConfigs` (unlike
      # `AdditionalMatrixConfigs`) is never consumed by the live-test stage in
      # archetype-sdk-client.yml, so these entries don't enter live stages,
      # deploy Azure resources, or replace live-test credentials with local
      # endpoints.
      - Name: Cosmos_vnext_emulator
        Path: sdk/cosmos/vnext-emulator-matrix.json
        Selection: all
        GenerateVMJobs: true
      - Name: Cosmos_inmemory_emulator
        # Both blocking jobs use port-zero host configs. Test setup parses the
        # ready record and exports the OS-assigned account and management URLs.
        Path: sdk/cosmos/inmemory-emulator-matrix.json
        Selection: all
        GenerateVMJobs: true
    LiveTestMatrixConfigs:
      - Name: Cosmos_live_test
        Path: sdk/cosmos/live-platform-matrix.json
        Selection: sparse
        GenerateVMJobs: true
      # Dedicated live leg that runs the full integration suite with the primary
      # (data-plane) client authenticated via Entra ID (AAD) instead of the
      # account key. `AZURE_COSMOS_AUTH_MODE=aad` surfaces as a job env var and
      # is read by the test framework (tests/framework/test_client.rs), which
      # then uses AAD for data-plane operations and the account key only for
      # database create/delete. Pinned to a single consistency config on Linux
      # to bound live-account cost.
      - Name: Cosmos_live_test_aad
        Path: sdk/cosmos/live-aad-platform-matrix.json
        Selection: all
        GenerateVMJobs: true
