parameters:
- name: Pool
  type: string
- name: Calibrate
  type: boolean
  default: false
- name: Weekly
  type: boolean
  default: false
- name: AutoCalibrate
  type: boolean
  default: false
- name: DependsOn
  type: object
  default: []

stages:
- stage: CosmosPerf
  displayName: Cosmos Gateway V2 performance
  dependsOn: ${{ parameters.DependsOn }}
  condition: succeededOrFailed()
  lockBehavior: sequential
  variables:
  - template: /eng/pipelines/templates/variables/rust.yml
  # Require an exclusive-lock check on this shared resource, including live-test consumers.
  - group: Test Secrets for Cosmos Live Tests - user administered
  - name: PerfOutput
    value: $(Build.ArtifactStagingDirectory)/cosmos-perf
  jobs:
  - job: Perf
    timeoutInMinutes: 120
    cancelTimeoutInMinutes: 5
    pool:
      name: ${{ parameters.Pool }}
      image: ubuntu-22.04
      os: linux
    workspace:
      clean: all
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0
      persistCredentials: false
    - pwsh: New-Item -ItemType Directory -Force -Path $env:COSMOS_PERF_OUTPUT | Out-Null
      displayName: Initialize performance artifact directory
      env:
        COSMOS_PERF_OUTPUT: $(PerfOutput)
    - task: PowerShell@2
      displayName: Verify source, baseline, fixed account, and VM region
      inputs:
        pwsh: true
        filePath: sdk/cosmos/eng/pipelines/prepare-cosmos-perf.ps1
      env:
        COSMOS_PERF_OUTPUT: $(PerfOutput)
        COSMOS_PERF_CALIBRATE: ${{ parameters.Calibrate }}
        COSMOS_PERF_WEEKLY: ${{ parameters.Weekly }}
        COSMOS_PERF_AUTO_CALIBRATE: ${{ parameters.AutoCalibrate }}
        COSMOS_TEST_ACCOUNTS_JSON: $(rust-ci)
    - template: /eng/pipelines/templates/steps/use-rust.yml
      parameters:
        Toolchain: stable
    - pwsh: |
        . ./eng/common/scripts/common.ps1
        . ./eng/scripts/shared/common.ps1
        Invoke-LoggedCommand 'cargo build --release --locked -p azure_data_cosmos_perf --bin azure_data_cosmos_perf --features weekly-gate' -GroupOutput
      displayName: Build perf crate at the pipeline source commit
    - task: PowerShell@2
      displayName: Run concurrent workload (5-minute warm-up, 40-minute measurement)
      inputs:
        pwsh: true
        filePath: sdk/cosmos/eng/pipelines/run-cosmos-perf.ps1
      env:
        COSMOS_PERF_OUTPUT: $(PerfOutput)
        COSMOS_TEST_ACCOUNTS_JSON: $(rust-ci)
    - task: PowerShell@2
      displayName: Clean up this run's benchmark database
      condition: always()
      inputs:
        pwsh: true
        filePath: sdk/cosmos/eng/pipelines/cleanup-cosmos-perf.ps1
      env:
        COSMOS_PERF_OUTPUT: $(PerfOutput)
        COSMOS_TEST_ACCOUNTS_JSON: $(rust-ci)
    - task: 1ES.PublishPipelineArtifact@1
      displayName: Publish performance evidence
      condition: always()
      inputs:
        targetPath: $(PerfOutput)
        artifactName: cosmos-perf-$(System.JobAttempt)
        sbomEnabled: false
