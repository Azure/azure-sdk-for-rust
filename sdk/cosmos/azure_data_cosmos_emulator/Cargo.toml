[package]
name = "azure_data_cosmos_emulator"
version = "0.1.0"
description = "Out-of-process host for the Azure Cosmos DB in-memory emulator"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum.workspace = true
# `azure_data_cosmos_driver` (below) depends on `azure_core` via
# `workspace = true` (the published crate), so this crate must resolve the same
# copy. Using a local `path` dependency here would instead pull the unreleased
# `sdk/core/azure_core`, producing two incompatible `AsyncRawResponse` types
# across the `data_plane`/`gateway_v2` boundary with `azure_data_cosmos_driver`.
azure_core = { workspace = true, default-features = false }
azure_data_cosmos_driver = { path = "../azure_data_cosmos_driver", default-features = false, features = [
  "rustls",
  "__internal_in_memory_emulator",
] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "net",
  "rt-multi-thread",
  "sync",
] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
url.workspace = true

[lints]
workspace = true
