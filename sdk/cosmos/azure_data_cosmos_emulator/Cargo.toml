[package]
name = "azure_data_cosmos_emulator"
version = "0.1.0"
description = "Out-of-process host for the Azure Cosmos DB in-memory emulator"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum.workspace = true
azure_core.workspace = true
azure_data_cosmos_driver = { path = "../azure_data_cosmos_driver", default-features = false, features = [
  "rustls",
  "__internal_in_memory_emulator",
] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
  "fs",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
url.workspace = true

[lints]
workspace = true
