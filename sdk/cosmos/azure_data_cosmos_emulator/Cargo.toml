[package]
name = "azure_data_cosmos_emulator"
version = "0.1.0"
description = "Out-of-process host for the Azure Cosmos DB in-memory emulator"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum.workspace = true
# Path+version — `azure_data_cosmos_driver` (below) depends on the local,
# unreleased `azure_core` (see its Cargo.toml), so this crate must resolve
# the same local copy. Using `workspace = true` here would instead pull the
# published crate, producing two incompatible `AsyncRawResponse` types
# across the `data_plane`/`gateway_v2` boundary with `azure_data_cosmos_driver`.
azure_core = { path = "../../core/azure_core", version = "1.2.0-beta.1", default-features = false }
azure_data_cosmos_driver = { path = "../azure_data_cosmos_driver", default-features = false, features = [
  "rustls",
  "__internal_in_memory_emulator",
] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "net",
  "rt-multi-thread",
  "sync",
] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
url.workspace = true

[lints]
workspace = true
