[package]
name = "azure_cosmos_change_feed_processor"
version = "0.1.0"
description = "Change feed processor for Azure Cosmos DB"
publish = false
readme = "README.md"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
azure_core.workspace = true
azure_cosmos_change_feed_processor_engine = { path = "../azure_cosmos_change_feed_processor_engine", version = "0.1.0" }
azure_data_cosmos_driver = { path = "../azure_data_cosmos_driver", version = "1.0.0-beta.2", default-features = false }
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
url.workspace = true

[dev-dependencies]
async-trait.workspace = true
azure_data_cosmos_driver = { path = "../azure_data_cosmos_driver", default-features = false, features = ["__internal_in_memory_emulator", "fault_injection"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "test-util"] }

[lints]
workspace = true
